<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBP 每日食堂與團購 🍽️🛒 (雲端協作版)</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        /* 這裡是你原本精美的奶茶色系 CSS */
        :root { --bg-color: #F4EBE4; --card-bg: #FFFFFF; --primary-color: #C0B0A2; --accent-color: #EBD8C9; --text-color: #5A5048; --active-color: #E6DEDC; --progress-bar: #D9C5B2; }
        body { font-family: "PingFang TC", sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header { margin-bottom: 20px; text-align: center; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 25px; background: var(--card-bg); padding: 6px; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--accent-color); }
        .tab-btn { background: none; border: none; padding: 10px 24px; font-size: 1.1rem; cursor: pointer; border-radius: 25px; color: var(--text-color); }
        .tab-btn.active { background-color: var(--primary-color); color: white; font-weight: bold; }
        .page { display: none; max-width: 1000px; width: 100%; gap: 20px; }
        .page.active { display: flex; }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--accent-color); }
        .menu-list { flex: 1; } .detail-panel { flex: 2; }
        .menu-item { padding: 15px; margin-bottom: 10px; background: var(--bg-color); border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .menu-item.active { background: var(--accent-color); border-color: var(--primary-color); font-weight: bold; }
        .status-summary { background: var(--bg-color); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; display: flex; justify-content: space-between; }
        .section-title { border-left: 4px solid var(--primary-color); padding-left: 10px; margin: 20px 0 10px 0; font-size: 1.2rem; }
        .claim-btn { background-color: var(--accent-color); border: 1px solid var(--primary-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .claim-btn.claimed { background-color: var(--active-color); color: #888; cursor: not-allowed; }
        .progress-container { background: #eee; border-radius: 10px; height: 20px; width: 100%; overflow: hidden; }
        .progress-bar { background-color: var(--progress-bar); height: 100%; width: 0%; transition: width 0.5s; }
        .order-table { width: 100%; border-collapse: collapse; }
        .order-table th, .order-table td { padding: 10px; border-bottom: 1px solid var(--accent-color); text-align: left; }
    </style>
</head>
<body>

<header>
    <h1 id="headerTitle">🍽️ BBP 雲端食堂</h1>
    <p>即時同步、多人協作版</p>
</header>

<div class="tab-container">
    <button class="tab-btn active" onclick="switchPage('menu')">🍽️ 每日菜單</button>
    <button class="tab-btn" onclick="switchPage('group')">🛒 團購專區</button>
</div>

<div class="page active" id="menuPage">
    <div class="panel menu-list" id="menuList">載入菜單中...</div>
    <div class="panel detail-panel">
        <h2 id="dishTitle">請選擇菜單</h2>
        <div class="status-summary">
            <span>今日主廚推薦 🌟</span>
            <span>參加：<span id="attendeeCount">0</span> 人</span>
        </div>
        <div class="section-title">材料認領區</div>
        <ul id="ingredientList" style="list-style:none; padding:0;"></ul>
        <div class="section-title">登記參加</div>
        <input type="text" id="nameInput" placeholder="輸入名字...">
        <button onclick="addAttendee()" style="padding:8px; border-radius:5px; cursor:pointer;">+1</button>
        <div id="attendeesTags" style="margin-top:10px; display:flex; gap:5px; flex-wrap:wrap;"></div>
    </div>
</div>

<div class="page" id="groupPage">
    <div class="panel" style="width:100%;">
        <h2 id="groupTitle">團購載入中...</h2>
        <p id="groupGoalText"></p>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div style="display:flex; gap:20px; margin-top:20px;">
            <div style="flex:1;">
                <h3>我要跟團</h3>
                <input type="text" id="buyerName" placeholder="名字"><br><br>
                <select id="productSelect" style="width:100%; padding:5px;"></select><br><br>
                <input type="number" id="buyQty" value="1" min="1" style="width:50px;">
                <button onclick="placeOrder()">加入 🛒</button>
            </div>
            <div style="flex:1.5;">
                <table class="order-table">
                    <thead><tr><th>團友</th><th>商品</th><th>數量</th><th>小計</th></tr></thead>
                    <tbody id="orderTableBody"></tbody>
                </table>
                <p style="text-align:right; font-weight:bold;">總計：<span id="totalGroupAmount">$0</span></p>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 初始化 Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCvhZUEhX0MiVSy84TTRluVHN_QgBVaBkg",
        authDomain: "bbp-food.firebaseapp.com",
        databaseURL: "https://bbp-food-default-rtdb.firebaseio.com",
        projectId: "bbp-food",
        storageBucket: "bbp-food.firebasestorage.app",
        messagingSenderId: "596590257801",
        appId: "1:596590257801:web:9cdcb3fb97acbb849f0858"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentDayKey = "day1";
    let cloudData = null;

    // 2. 監聽雲端資料變動
    db.ref('bbp_data').on('value', (snapshot) => {
        cloudData = snapshot.val();
        if (cloudData) renderAll();
    });

    function renderAll() {
        renderMenuList();
        renderDetail();
        renderGroupBuy();
    }

    function switchPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(page + 'Page').classList.add('active');
        event.target.classList.add('active');
    }

    function renderMenuList() {
        const list = document.getElementById('menuList');
        list.innerHTML = "";
        Object.keys(cloudData.menu).forEach(key => {
            const item = cloudData.menu[key];
            const div = document.createElement('div');
            div.className = `menu-item ${key === currentDayKey ? 'active' : ''}`;
            div.innerHTML = `<div>${item.date}</div><div>${item.dish}</div>`;
            div.onclick = () => { currentDayKey = key; renderAll(); };
            list.appendChild(div);
        });
    }

    function renderDetail() {
        const day = cloudData.menu[currentDayKey];
        document.getElementById('dishTitle').innerHTML = `${day.dish} <button onclick="editDish()" style="font-size:10px;">✎編輯</button>`;
        document.getElementById('attendeeCount').innerText = (day.attendees || []).length;
        
        const ingList = document.getElementById('ingredientList');
        ingList.innerHTML = "";
        (day.ingredients || []).forEach((ing, i) => {
            ingList.innerHTML += `<li>${ing.name} - ${ing.claimedBy ? '✅ '+ing.claimedBy : '<button onclick="claim('+i+')">認領</button>'}</li>`;
        });

        const tags = document.getElementById('attendeesTags');
        tags.innerHTML = (day.attendees || []).map(a => `<span style="background:#eee; padding:5px; border-radius:10px;">🙋‍♂️ ${a}</span>`).join(' ');
    }

    function editDish() {
        const n = prompt("輸入新菜名：", cloudData.menu[currentDayKey].dish);
        if (n) db.ref(`bbp_data/menu/${currentDayKey}/dish`).set(n);
    }

    function claim(i) {
        const name = prompt("你的名字：");
        if (name) db.ref(`bbp_data/menu/${currentDayKey}/ingredients/${i}/claimedBy`).set(name);
    }

    function addAttendee() {
        const name = document.getElementById('nameInput').value;
        if (!name) return;
        let list = cloudData.menu[currentDayKey].attendees || [];
        if (!list.includes(name)) {
            list.push(name);
            db.ref(`bbp_data/menu/${currentDayKey}/attendees`).set(list);
        }
        document.getElementById('nameInput').value = "";
    }

    function renderGroupBuy() {
        const g = cloudData.group;
        document.getElementById('groupTitle').innerText = "🔥 團購："
